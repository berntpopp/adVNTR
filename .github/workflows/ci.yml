name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This is a hard fork (see FORK.md). Fail loudly if an upstream remote reappears,
      # before spending five minutes on a conda solve.
      - name: Refuse an upstream remote
        shell: bash
        run: |
          if git remote | grep -qx upstream; then
            echo "::error::an 'upstream' remote exists. This is a hard fork; see FORK.md."
            exit 1
          fi

      # Cheap and needs no toolchain, so it runs before the environment is built.
      - name: File-size ratchet
        shell: bash
        run: python3 scripts/loc_ratchet.py

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '2.7'
          channels: conda-forge,bioconda
          auto-activate-base: false
          activate-environment: envadvntr

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install dependencies
        run: |
          # muscle is pinned to the v3 series on purpose. `build_profile_hmm_for_repeats`
          # invokes `muscle -clwstrict`, which MUSCLE v5 removed -- an unpinned install
          # now resolves v5 and every model-building test errors with "Invalid command
          # line". Adapting the flags would not be enough either: v5 is a different
          # aligner and returns different alignments, so the profile HMMs built from
          # them would differ and the Tier 1 byte-equivalence gate this fork rests on
          # would no longer mean anything. The alignment tool is part of the result.
          conda install -y "cython=0.29.*" "numpy=1.16.*" scipy biopython pysam \
                           "muscle=3.8.1551" scikit-learn "coverage<5"

      - name: Build the extension
        run: python setup_hmm.py build_ext --inplace

      # Guards the claim the whole rewrite rests on. If the DP stops running without the
      # GIL, every threading number becomes fiction and nothing else here would notice:
      # the outputs are identical either way, the read-selection threading test drives a
      # pure-Python stub model, and no test asserts wall-clock or scaling.
      #
      # This used to be `grep -c Py_UNBLOCK_THREADS hmm/hmm.c` with a >= 1 threshold, which
      # counted releases anywhere in a 1.7 MB generated file. Measured on a build where the
      # DP holds the GIL and one unrelated function releases it, that grep reports GREEN;
      # the script reports the DP call outside any released region and exits 1.
      - name: Assert the DP call is still emitted inside a nogil region
        run: python scripts/assert_gil_release.py hmm/hmm.c

      - name: Unit suite, Tier 1 equivalence gate, characterization
        run: python -m unittest discover tests -v

      - name: Coverage ratchet
        run: make coverage-ratchet

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage-now
          if-no-files-found: ignore

  # Tier 2 needs VNtyper's 1.8 GB corpus, so it cannot run on a hosted runner.
  # Kept as a documented manual entry point rather than a job that silently never runs.
  tier2-note:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Explain how to run the full-corpus gate
        run: |
          echo "Tier 2 requires VNtyper's tests/data and runs for hours."
          echo "Run it on a machine that has the corpus:"
          echo "  make tier2"
          echo "It verifies per-file input attestation, model context, and output digest."
